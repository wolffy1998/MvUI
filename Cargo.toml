[package]
name = "mvui"
edition = "2021"
version = "1.0.0"
license = "GPL-3.0-or-later"
description = "MAME Visual User Interface — A modern and lightweight frontend for MAME."
repository = "https://github.com/wolffy1998/MvUI"
readme = "README.md"

[[bin]]
name = "mvui"
path = "src/main.rs"

# A library target next to the binary so `examples/` and any future integration
# tests can reach the domain layer. It is the same code — `main.rs` declares
# `pub mod core` and this target just re-exports it; there is no second copy.
[lib]
name = "mvui"
path = "src/lib.rs"

[dependencies]
# --- ui ---
eframe = { version = "0.29", default-features = false, features = ["glow", "default_fonts"] }
egui = "0.29"
egui_extras = "0.29"
egui_dock = { version = "0.14", features = ["serde"] }
rfd = "0.15"

# --- domain (`src/core/`) ---
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1.3"
quick-xml = "0.41"
zip = { version = "2", default-features = false, features = ["deflate"] }
# Artwork archives are read by `core::zip64` instead (the 6 GB MAME Plus! snap
# pack is a Zip64 shape `zip` 2.4.2 mis-parses), and that reader needs a raw
# deflate decoder. Already in the tree via `zip`'s own deflate feature; named
# here because we depend on it directly.
flate2 = "1"
sevenz-rust = "0.6"
regex = "1"
crc32fast = "1"
thiserror = "2"
encoding_rs = "0.8.42"
image = { version = "0.25", default-features = false, features = ["png", "ico", "jpeg", "gif", "bmp"] }

[build-dependencies]
winresource = "0.1.31"

[profile.release]
lto = "thin"
strip = true
