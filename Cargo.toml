[package]
name = "mvui"
edition = "2021"
version = "1.0.0"
license = "GPL-3.0-or-later"
description = "A native Windows front-end for MAME, a rewrite of mamepgui 1.8.2 in Rust + egui"
repository = "https://github.com/wolffy1998/MvUI"
readme = "README.md"

# Single crate: the domain layer lives in `src/core/` and the UI in the modules
# beside it. It used to be two crates (`mamegui-core` + `mamegui-app`), which
# bought one real guarantee — core could declare that it does not depend on egui
# — at the cost of a nested workspace and a `mamegui-core::` prefix on ~80
# import sites. The layering is now documented in `src/core/mod.rs` instead.
#
# The exe icon still needs a build script (it embeds assets/app.ico via
# winresource), and that build script is where the icon table is generated.
[package.metadata.notes]
scope = "IPS/M1 deferred by design"

[[bin]]
name = "mvui"
path = "src/main.rs"

# A library target next to the binary so `examples/` and any future integration
# tests can reach the domain layer. It is the same code — `main.rs` declares
# `pub mod core` and this target just re-exports it; there is no second copy.
[lib]
name = "mvui"
path = "src/lib.rs"

[dependencies]
# --- ui ---
eframe = { version = "0.29", default-features = false, features = ["glow", "default_fonts"] }
egui = "0.29"
egui_extras = "0.29"
egui_dock = { version = "0.14", features = ["serde"] }
rfd = "0.15"

# --- domain (`src/core/`) ---
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1.3"
quick-xml = "0.41"
zip = { version = "2", default-features = false, features = ["deflate"] }
sevenz-rust = "0.6"
regex = "1"
rayon = "1"
crc32fast = "1"
thiserror = "2"
encoding_rs = "0.8.42"
image = { version = "0.25", default-features = false, features = ["png", "ico", "jpeg", "gif", "bmp"] }

[build-dependencies]
winresource = "0.1.31"

[profile.release]
lto = "thin"
strip = true
