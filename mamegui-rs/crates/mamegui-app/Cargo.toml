[package]
name = "mamegui-app"
edition.workspace = true
version.workspace = true
license.workspace = true

[[bin]]
name = "mvui"
path = "src/main.rs"

[dependencies]
mamegui-core = { path = "../mamegui-core" }
eframe = { version = "0.29", default-features = false, features = ["glow", "default_fonts"] }
egui = "0.29"
egui_extras = "0.29"
egui_dock = { version = "0.14", features = ["serde"] }
rfd = "0.15"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png", "ico", "jpeg", "gif", "bmp"] }

[build-dependencies]
winresource = "0.1.31"

[package.metadata.notes]
scope = "IPS/M1 deferred by design"
